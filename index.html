<!DOCTYPE html>

<style>
  :root{--navy:#12123c;--bg:#f3f4f8;--line:#e3e5ee;}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);font-family:'Poppins',sans-serif;color:#1c1d2b;min-height:100vh;
       padding:calc(28px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));}
  .wrap{max-width:520px;margin:0 auto}
  header{text-align:center;margin-bottom:28px}
  header img{width:150px;height:auto;display:block;margin:0 auto 14px}
  header p{margin:0;font-size:14px;color:#6c7086}
  a.card{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid var(--line);border-radius:16px;
         padding:20px;margin-bottom:14px;text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s}
  a.card:active{transform:scale(.98)}
  a.card:hover{box-shadow:0 6px 20px rgba(18,18,60,.08)}
  .ic{flex:0 0 52px;height:52px;border-radius:14px;background:var(--navy);color:#fff;display:grid;place-items:center}
  .ic svg{width:26px;height:26px}
  h2{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:19px;margin:0 0 2px;color:var(--navy)}
  .card p{margin:0;font-size:13px;color:#6c7086;line-height:1.45}
  .ic.av{background:none;border-radius:50%;overflow:hidden}
  .ic.av img{width:52px;height:52px;display:block}
  .chev{margin-left:auto;color:#b7bad0;font-size:22px}
  #install{display:none;width:100%;margin-top:10px;padding:14px;border:0;border-radius:12px;background:var(--navy);color:#fff;
           font:600 14px 'Poppins',sans-serif;cursor:pointer}
  footer{text-align:center;margin-top:26px;font-size:12px;color:#9aa0b4}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="logo-guy-hoquet.png" alt="Guy Hoquet">
    <p>Agence de Saint-Omer · Annonces animées</p>
  </header>

  <a class="card" href="https://n8n-cncy.srv1761873.hstgr.cloud/webhook/e9bd9216-0d0a-4662-b8af-0de42dcded82/chat" target="_blank" rel="noopener">
    <div class="ic av"><img src="avatar-assistante.svg" alt=""></div>
    <div><h2>Émi, assistante d'agence</h2><p>Discuter avec l'assistante IA de l'agence.</p></div>
    <span class="chev">›</span>
  </a>

  <a class="card" href="generateur-annonce-guy-hoquet.html">
    <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/></svg></div>
    <div><h2>Nouvelle annonce</h2><p>Créer une annonce animée pour un bien à vendre.</p></div>
    <span class="chev">›</span>
  </a>

  <a class="card" href="generateur-les-vendus-guy-hoquet.html">
    <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
    <div><h2>Les Vendus</h2><p>Raconter une vente : sous compromis, vendu, signé.</p></div>
    <span class="chev">›</span>
  </a>

  <button id="install">Installer l'application</button>
  <footer>Guy Hoquet Saint-Omer · 8 rue de l'Écusserie</footer>
</div>
<script>
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
  var deferred; var btn=document.getElementById('install');
  window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); deferred=e; btn.style.display='block'; });
  btn.addEventListener('click', function(){ if(!deferred) return; deferred.prompt(); deferred.userChoice.finally(function(){ deferred=null; btn.style.display='none'; }); });
</script>
</body>
</html>
