<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <clipPath id="c"><circle cx="60" cy="60" r="60"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a3a8c"/><stop offset="1" stop-color="#12123c"/></linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6d77a"/><stop offset="1" stop-color="#d9a84a"/></linearGradient>
  </defs>
  <g clip-path="url(#c)">
    <rect width="120" height="120" fill="url(#bg)"/>
    <!-- touches dynamiques -->
    <path d="M14 30l8 3M10 44l9 1M106 28l-8 4M110 42l-9 2" stroke="#f5c542" stroke-width="2.4" stroke-linecap="round" opacity=".85"/>
    <g transform="rotate(-6 60 70)">
      <!-- queue de cheval en mouvement -->
      <path d="M78 36c14 0 24 10 22 26-1 10 4 16 8 20-10 1-20-6-22-16-2-8-6-14-12-16z" fill="url(#hair)"/>
      <!-- buste -->
      <path d="M16 126c2-20 19-31 44-31s42 11 44 31z" fill="#ffffff"/>
      <path d="M40 98l20 22 20-22c5 1 9 3 13 6l-13 22H40L27 104c4-3 8-5 13-6z" fill="#e6334a"/>
      <path d="M48 96c3 6 7 9 12 9s9-3 12-9c-4-1-8-2-12-2s-8 1-12 2z" fill="#f4cfb0"/>
      <!-- cou -->
      <path d="M52 78h16v17c-2 4-6 6-8 6s-6-2-8-6z" fill="#ebbd99"/>
      <!-- visage -->
      <ellipse cx="60" cy="58" rx="20" ry="23.5" fill="#f6d3b6"/>
      <ellipse cx="40.5" cy="61" rx="3" ry="4.5" fill="#ebbd99"/>
      <ellipse cx="79.5" cy="61" rx="3" ry="4.5" fill="#ebbd99"/>
      <!-- cheveux : dessus + frange balayée -->
      <path d="M38 56c-2-22 10-34 23-34 14 0 24 10 22 30-3-8-9-14-17-17-6 9-17 15-28 21z" fill="url(#hair)"/>
      <path d="M45 40c6-6 14-9 22-8" stroke="#fbe7a8" stroke-width="2" fill="none" stroke-linecap="round" opacity=".8"/>
      <!-- sourcils levés -->
      <path d="M46 49q5-4 10-1M64 48q5-3 10 1" stroke="#b07a3a" stroke-width="2" fill="none" stroke-linecap="round"/>
      <!-- yeux souriants -->
      <path d="M48.5 58q3.5-3.5 7 0M64.5 58q3.5-3.5 7 0" stroke="#2b1b14" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <!-- joues -->
      <circle cx="47" cy="66" r="3.8" fill="#f09a8c" opacity=".5"/><circle cx="73" cy="66" r="3.8" fill="#f09a8c" opacity=".5"/>
      <!-- nez -->
      <path d="M60 60v5l-2 1" stroke="#d9a07c" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <!-- grand sourire -->
      <path d="M51 70q9 1 18 0q-1 9-9 9t-9-9z" fill="#b8323f"/>
      <path d="M52.5 70.6q7.5.9 15 0l-.6 2.4q-6.9.8-13.8 0z" fill="#fff"/>
      <!-- boucles d'oreilles -->
      <circle cx="40.5" cy="67" r="1.8" fill="#f5c542"/><circle cx="79.5" cy="67" r="1.8" fill="#f5c542"/>
    </g>
  </g>
</svg>
